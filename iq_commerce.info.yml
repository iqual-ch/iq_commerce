name: iQual Commerce Extension
description: Provides additional functionality for the Commerce for iQual.
package: Custom
type: module
core_version_requirement: ^10 || ^11
dependencies:
  - commerce:commerce_tax (price,order)
  - commerce:commerce_checkout
  - commerce:commerce_payment
  - commerce_shipping:commerce_shipping
  - commerce_variation_cart_form:commerce_variation_cart_form
  - commerce_variation_add_to_cart:commerce_variation_add_to_cart
  - media_entity_browser:media_entity_browser
  - hierarchical_taxonomy_menu:hierarchical_taxonomy_menu
  - term_reference_tree:term_reference_tree
  - twig_tweak:twig_tweak
  - commerce_combine_carts:commerce_combine_carts
  - redirect_after_login:redirect_after_login
  - login_emailusername:login_emailusername
  - entity_print:entity_print
  - symfony_mailer:symfony_mailer
  - ui_patterns:ui_patterns
